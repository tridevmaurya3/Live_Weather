<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { width:100%; height:100%; margin:0; padding:0; background:#0b1f36; }
        body { overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
        .leaflet-control-attribution { background:rgba(6,16,29,.76)!important; color:#dbe9f4!important; font-size:9px!important; }
        .leaflet-control-attribution a { color:#8ed9ff!important; }
        .leaflet-base-pane img { filter:saturate(.72) brightness(.72) contrast(1.08); }
        .location-pulse { width:18px; height:18px; border-radius:50%; background:#53d8ff; border:3px solid #fff; box-shadow:0 0 0 8px rgba(83,216,255,.18),0 0 22px rgba(83,216,255,.7); }
        .wind-arrow { display:flex; align-items:center; gap:4px; color:#e9f8ff; text-shadow:0 1px 4px #00101f; font-weight:700; font-size:10px; white-space:nowrap; }
        .wind-arrow .arrow { display:inline-block; font-size:19px; color:#6fe6ff; transform-origin:50% 50%; }
        .temp-dot { min-width:34px; height:34px; border-radius:17px; display:flex; align-items:center; justify-content:center; color:white; font-size:10px; font-weight:800; border:1px solid rgba(255,255,255,.7); box-shadow:0 2px 8px rgba(0,0,0,.32); }
        .leaflet-control-zoom a { background:#102d49!important; color:#e7f6ff!important; border-color:#31506b!important; }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
    const map = L.map('map', { minZoom:3, maxZoom:7, zoomControl:true, preferCanvas:true }).setView([22.6, 79.0], 5);
    map.createPane('basePane');
    map.getPane('basePane').classList.add('leaflet-base-pane');
    map.getPane('basePane').style.zIndex = 200;
    map.createPane('radarPane');
    map.getPane('radarPane').style.zIndex = 430;

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        pane:'basePane', maxZoom:7,
        attribution:'&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
    }).addTo(map);
    map.attributionControl.addAttribution('<a href="https://open-meteo.com/">Open-Meteo</a> model overlays');

    let payload = null;
    let activeLayer = 'rain';
    let frameIndex = 0;
    let radarLayer = null;
    let cloudGroup = L.layerGroup();
    let windGroup = L.layerGroup();
    let tempGroup = L.layerGroup();
    let locationMarker = null;

    function clearWeatherLayers() {
        if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
        map.removeLayer(cloudGroup);
        map.removeLayer(windGroup);
        map.removeLayer(tempGroup);
    }

    function makeRadarLayer(index) {
        if (!payload || !payload.radarHost || !payload.frames || !payload.frames.length) return null;
        const safeIndex = Math.max(0, Math.min(index, payload.frames.length - 1));
        const frame = payload.frames[safeIndex];
        if (!frame || !frame.path) return null;
        const url = payload.radarHost + frame.path + '/256/{z}/{x}/{y}/2/1_1.png';
        return L.tileLayer(url, {
            pane:'radarPane', opacity:.78, maxZoom:7, tileSize:256,
            attribution:'Radar: <a href="https://www.rainviewer.com/">RainViewer</a>'
        });
    }

    function cloudOpacity(value) {
        const c = Math.max(0, Math.min(100, value || 0));
        return 0.04 + (c / 100) * 0.48;
    }

    function tempColor(t) {
        if (t == null || isNaN(t)) return '#6c8da4';
        if (t <= 5) return '#3997d3';
        if (t <= 15) return '#52b6c9';
        if (t <= 25) return '#70b96e';
        if (t <= 32) return '#e6b94b';
        if (t <= 38) return '#ee8348';
        return '#d95145';
    }

    function rebuildFieldLayers() {
        cloudGroup = L.layerGroup();
        windGroup = L.layerGroup();
        tempGroup = L.layerGroup();
        if (!payload || !payload.field) return;

        payload.field.forEach(function (p) {
            if (p.lat == null || p.lon == null) return;
            const half = 0.50;
            const cloud = Math.max(0, Math.min(100, p.cloud == null ? 0 : p.cloud));
            const cloudColor = cloud > 78 ? '#c9d0d7' : cloud > 45 ? '#dce4eb' : '#eef5fa';
            L.rectangle([[p.lat-half,p.lon-half],[p.lat+half,p.lon+half]], {
                stroke:false, fill:true, fillColor:cloudColor, fillOpacity:cloudOpacity(cloud), interactive:false
            }).addTo(cloudGroup);

            const flowDirection = ((p.windDirection || 0) + 180) % 360;
            const windText = p.windSpeed == null ? '--' : Math.round(p.windSpeed) + ' km/h';
            const windHtml = '<div class="wind-arrow"><span class="arrow" style="transform:rotate(' + flowDirection + 'deg)">➜</span><span>' + windText + '</span></div>';
            L.marker([p.lat,p.lon], {
                interactive:false,
                icon:L.divIcon({className:'', html:windHtml, iconSize:[74,28], iconAnchor:[37,14]})
            }).addTo(windGroup);

            const temp = p.temperature;
            const tempText = temp == null ? '--' : Math.round(temp) + '°';
            const tempHtml = '<div class="temp-dot" style="background:' + tempColor(temp) + '">' + tempText + '</div>';
            L.marker([p.lat,p.lon], {
                interactive:false,
                icon:L.divIcon({className:'', html:tempHtml, iconSize:[34,34], iconAnchor:[17,17]})
            }).addTo(tempGroup);
        });
    }

    function updateLocationMarker() {
        if (!payload) return;
        if (locationMarker) map.removeLayer(locationMarker);
        locationMarker = L.marker([payload.latitude,payload.longitude], {
            zIndexOffset:1200,
            icon:L.divIcon({className:'', html:'<div class="location-pulse"></div>', iconSize:[24,24], iconAnchor:[12,12]})
        }).addTo(map);
    }

    function applyLayer() {
        clearWeatherLayers();
        if (!payload) return;
        if (activeLayer === 'rain') {
            radarLayer = makeRadarLayer(frameIndex);
            if (radarLayer) radarLayer.addTo(map);
        } else if (activeLayer === 'clouds') {
            cloudGroup.addTo(map);
        } else if (activeLayer === 'wind') {
            windGroup.addTo(map);
        } else if (activeLayer === 'temp') {
            tempGroup.addTo(map);
        }
    }

    window.RadarApp = {
        setData: function (data) {
            payload = (typeof data === 'string') ? JSON.parse(data) : data;
            if (!payload) return;
            frameIndex = payload.frames && payload.frames.length ? payload.frames.length - 1 : 0;
            rebuildFieldLayers();
            updateLocationMarker();
            map.setView([payload.latitude,payload.longitude], payload.zoom || 6, {animate:false});
            applyLayer();
        },
        setLayer: function (layer) {
            activeLayer = layer || 'rain';
            applyLayer();
        },
        setFrame: function (index) {
            frameIndex = index || 0;
            if (activeLayer === 'rain') applyLayer();
        },
        recenter: function () {
            if (payload) map.setView([payload.latitude,payload.longitude], payload.zoom || 6, {animate:true});
        }
    };
})();
</script>
</body>
</html>
