<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        html, body, #map { width:100%; height:100%; margin:0; padding:0; }
        html, body { background:#0b1f36; }
        body { overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
        #map {
            background-color:#0b1f36;
            background-image:
                linear-gradient(rgba(126,176,211,.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(126,176,211,.07) 1px, transparent 1px);
            background-size:36px 36px;
        }
        #mapShell {
            position:absolute;
            inset:0;
            z-index:1600;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:22px;
            pointer-events:none;
            background:linear-gradient(180deg, rgba(8,25,42,.24), rgba(8,25,42,.68));
            box-sizing:border-box;
        }
        #mapShell.hidden { display:none; }
        .shell-card {
            max-width:340px;
            border:1px solid rgba(124,232,225,.28);
            border-radius:18px;
            padding:14px 16px;
            background:rgba(9,29,48,.92);
            box-shadow:0 12px 32px rgba(0,0,0,.28);
            color:#f6faff;
            text-align:center;
        }
        .shell-card.warning { border-color:rgba(255,210,122,.42); }
        .shell-title { color:#7ce8e1; font-size:13px; font-weight:800; letter-spacing:.05em; }
        .shell-card.warning .shell-title { color:#ffd27a; }
        .shell-body { margin-top:6px; color:#b8c7d9; font-size:11px; line-height:1.45; }
        .leaflet-control-attribution { background:rgba(6,16,29,.78)!important; color:#dbe9f4!important; font-size:9px!important; }
        .leaflet-control-attribution a { color:#8ed9ff!important; }
        .leaflet-base-pane img { filter:saturate(.72) brightness(.78) contrast(1.06); }
        .location-pulse { width:18px; height:18px; border-radius:50%; background:#53d8ff; border:3px solid #fff; box-shadow:0 0 0 8px rgba(83,216,255,.18),0 0 22px rgba(83,216,255,.7); }
        .wind-arrow { display:flex; align-items:center; gap:4px; color:#e9f8ff; text-shadow:0 1px 4px #00101f; font-weight:700; font-size:10px; white-space:nowrap; }
        .wind-arrow .arrow { display:inline-block; font-size:19px; color:#6fe6ff; transform-origin:50% 50%; }
        .temp-dot { min-width:34px; height:34px; border-radius:17px; display:flex; align-items:center; justify-content:center; color:white; font-size:10px; font-weight:800; border:1px solid rgba(255,255,255,.7); box-shadow:0 2px 8px rgba(0,0,0,.32); padding:0 4px; }
        .leaflet-control-zoom a { background:#102d49!important; color:#e7f6ff!important; border-color:#31506b!important; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="mapShell" role="status" aria-live="polite">
    <div id="mapShellCard" class="shell-card">
        <div id="mapShellTitle" class="shell-title">PREPARING RADAR MAP</div>
        <div id="mapShellBody" class="shell-body">Loading the interactive map engine…</div>
    </div>
</div>
<script>
(function () {
    'use strict';

    const LEAFLET_VERSION = '1.9.4';
    const LEAFLET_JS_URL = 'https://unpkg.com/leaflet@' + LEAFLET_VERSION + '/dist/leaflet.js';
    const LEAFLET_CSS_URL = 'https://unpkg.com/leaflet@' + LEAFLET_VERSION + '/dist/leaflet.css';
    const LEAFLET_LOAD_TIMEOUT_MILLIS = 9000;
    const CLOUD_SURFACE_SIZE = 144;

    const shell = document.getElementById('mapShell');
    const shellCard = document.getElementById('mapShellCard');
    const shellTitle = document.getElementById('mapShellTitle');
    const shellBody = document.getElementById('mapShellBody');

    let map = null;
    let baseLayer = null;
    let leafletLoadPromise = null;
    let leafletScript = null;
    let payload = null;
    let activeLayer = 'rain';
    let frameIndex = 0;
    let radarLayer = null;
    let radarLayerUrl = null;
    let cloudSurfaceLayer = null;
    let windGroup = null;
    let tempGroup = null;
    let locationMarker = null;
    let suspended = false;

    function showShell(title, body, warning) {
        shellTitle.textContent = title;
        shellBody.textContent = body;
        shellCard.classList.toggle('warning', !!warning);
        shell.classList.remove('hidden');
    }

    function hideShell() {
        shell.classList.add('hidden');
    }

    function ensureLeafletCss(forceRetry) {
        const current = document.getElementById('leaflet-css');
        if (current && !forceRetry) return;
        if (current && current.parentNode) current.parentNode.removeChild(current);

        const link = document.createElement('link');
        link.id = 'leaflet-css';
        link.rel = 'stylesheet';
        link.href = LEAFLET_CSS_URL;
        document.head.appendChild(link);
    }

    function removeLeafletScript() {
        if (leafletScript && leafletScript.parentNode) {
            leafletScript.parentNode.removeChild(leafletScript);
        }
        leafletScript = null;
    }

    function loadLeaflet(forceRetry) {
        if (window.L) {
            initializeMap();
            return Promise.resolve(true);
        }

        // Never overlap engine-load attempts. A Refresh/Recenter during an active
        // attempt simply joins it; explicit retry starts after that attempt ends.
        if (leafletLoadPromise) return leafletLoadPromise;

        if (forceRetry) removeLeafletScript();
        ensureLeafletCss(forceRetry);
        showShell(
            'PREPARING RADAR MAP',
            payload ? 'Weather data is ready. Loading the interactive map engine…' : 'Loading the interactive map engine…',
            false
        );

        leafletLoadPromise = new Promise(function (resolve) {
            let finished = false;
            let timeoutId = 0;
            const finish = function (success) {
                if (finished) return;
                finished = true;
                if (timeoutId) window.clearTimeout(timeoutId);
                leafletLoadPromise = null;

                if (success && window.L) {
                    try {
                        initializeMap();
                        resolve(true);
                        return;
                    } catch (error) {
                        console.warn('Radar map initialization failed', error);
                    }
                }

                showShell(
                    'INTERACTIVE MAP UNAVAILABLE',
                    payload
                        ? 'Radar/model data is retained in the app. Reconnect and reopen, Refresh, or Recenter to retry the map engine.'
                        : 'The local Radar page is available, but the interactive map engine could not load. Reconnect and retry.',
                    true
                );
                resolve(false);
            };

            leafletScript = document.createElement('script');
            leafletScript.id = 'leaflet-js';
            leafletScript.src = LEAFLET_JS_URL;
            leafletScript.async = true;
            leafletScript.onload = function () { finish(true); };
            leafletScript.onerror = function () { finish(false); };
            document.head.appendChild(leafletScript);

            timeoutId = window.setTimeout(function () {
                finish(false);
            }, LEAFLET_LOAD_TIMEOUT_MILLIS);
        });

        return leafletLoadPromise;
    }

    function initializeMap() {
        if (map || !window.L) return;

        map = L.map('map', {
            minZoom:3,
            maxZoom:7,
            zoomControl:true,
            preferCanvas:true,
            zoomAnimation:true,
            fadeAnimation:true
        }).setView([22.6, 79.0], 5);

        map.createPane('basePane');
        map.getPane('basePane').classList.add('leaflet-base-pane');
        map.getPane('basePane').style.zIndex = 200;

        map.createPane('cloudPane');
        map.getPane('cloudPane').style.zIndex = 410;
        map.getPane('cloudPane').style.pointerEvents = 'none';

        map.createPane('radarPane');
        map.getPane('radarPane').style.zIndex = 430;

        baseLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane:'basePane',
            maxZoom:7,
            keepBuffer:1,
            updateWhenIdle:true,
            attribution:'&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
        }).addTo(map);

        map.attributionControl.addAttribution('<a href="https://open-meteo.com/">Open-Meteo</a> model overlays');
        windGroup = L.layerGroup();
        tempGroup = L.layerGroup();

        if (payload) applyPayloadToMap();
        if (suspended) map.stop();
        hideShell();
    }

    function clearWeatherLayers() {
        if (!map) return;
        if (radarLayer && map.hasLayer(radarLayer)) map.removeLayer(radarLayer);
        if (cloudSurfaceLayer && map.hasLayer(cloudSurfaceLayer)) map.removeLayer(cloudSurfaceLayer);
        if (windGroup && map.hasLayer(windGroup)) map.removeLayer(windGroup);
        if (tempGroup && map.hasLayer(tempGroup)) map.removeLayer(tempGroup);
    }

    function radarUrl(index) {
        if (!payload || !payload.radarHost || !payload.frames || !payload.frames.length) return null;
        const safeIndex = Math.max(0, Math.min(index, payload.frames.length - 1));
        const frame = payload.frames[safeIndex];
        if (!frame || !frame.path) return null;
        return payload.radarHost + frame.path + '/256/{z}/{x}/{y}/2/1_1.png';
    }

    function ensureRadarLayer(index) {
        if (!map || !window.L) return null;
        const url = radarUrl(index);
        if (!url) return null;

        if (!radarLayer) {
            radarLayer = L.tileLayer(url, {
                pane:'radarPane',
                opacity:.78,
                maxZoom:7,
                tileSize:256,
                keepBuffer:1,
                updateWhenIdle:true,
                attribution:'Radar: <a href="https://www.rainviewer.com/">RainViewer</a>'
            });
            radarLayerUrl = url;
        } else if (radarLayerUrl !== url) {
            radarLayer.setUrl(url);
            radarLayerUrl = url;
        }
        return radarLayer;
    }

    function tempColor(t) {
        if (t == null || isNaN(t)) return '#6c8da4';
        if (t <= 5) return '#3997d3';
        if (t <= 15) return '#52b6c9';
        if (t <= 25) return '#70b96e';
        if (t <= 32) return '#e6b94b';
        if (t <= 38) return '#ee8348';
        return '#d95145';
    }

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function smoothstep(edge0, edge1, value) {
        if (edge0 === edge1) return value >= edge1 ? 1 : 0;
        const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
        return t * t * (3 - 2 * t);
    }

    function wrappedLongitudeNear(longitude, center) {
        let value = longitude;
        while (value - center > 180) value -= 360;
        while (value - center < -180) value += 360;
        return value;
    }

    function invalidateCloudSurface() {
        if (map && cloudSurfaceLayer && map.hasLayer(cloudSurfaceLayer)) {
            map.removeLayer(cloudSurfaceLayer);
        }
        cloudSurfaceLayer = null;
    }

    function buildContinuousCloudSurface(points) {
        if (!map || !window.L || !points || points.length < 4) return null;

        const centerLon = payload && Number.isFinite(Number(payload.longitude))
            ? Number(payload.longitude)
            : Number(points[0].lon || 0);

        const samples = [];
        points.forEach(function (point) {
            const lat = Number(point.lat);
            const lon = Number(point.lon);
            const cloud = Number(point.cloud);
            if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(cloud)) return;
            samples.push({
                lat:lat,
                lon:wrappedLongitudeNear(lon, centerLon),
                cloud:clamp(cloud, 0, 100)
            });
        });
        if (samples.length < 4) return null;

        let minLat = samples[0].lat;
        let maxLat = samples[0].lat;
        let minLon = samples[0].lon;
        let maxLon = samples[0].lon;
        samples.forEach(function (sample) {
            minLat = Math.min(minLat, sample.lat);
            maxLat = Math.max(maxLat, sample.lat);
            minLon = Math.min(minLon, sample.lon);
            maxLon = Math.max(maxLon, sample.lon);
        });

        const sampleLatSpan = Math.max(0.5, maxLat - minLat);
        const sampleLonSpan = Math.max(0.5, maxLon - minLon);
        if (sampleLonSpan > 30) return null;

        const latPadding = Math.max(0.30, sampleLatSpan * 0.12);
        const lonPadding = Math.max(0.30, sampleLonSpan * 0.12);
        const south = minLat - latPadding;
        const north = maxLat + latPadding;
        const west = minLon - lonPadding;
        const east = maxLon + lonPadding;
        const renderLatSpan = Math.max(0.001, north - south);
        const renderLonSpan = Math.max(0.001, east - west);

        const canvas = document.createElement('canvas');
        canvas.width = CLOUD_SURFACE_SIZE;
        canvas.height = CLOUD_SURFACE_SIZE;
        const context = canvas.getContext('2d', {alpha:true});
        if (!context) return null;

        const image = context.createImageData(CLOUD_SURFACE_SIZE, CLOUD_SURFACE_SIZE);
        const pixels = image.data;
        const centerLat = (north + south) * 0.5;
        const lonMetric = Math.max(0.28, Math.cos(centerLat * Math.PI / 180));

        for (let y = 0; y < CLOUD_SURFACE_SIZE; y++) {
            const v = y / (CLOUD_SURFACE_SIZE - 1);
            const lat = north - v * renderLatSpan;

            for (let x = 0; x < CLOUD_SURFACE_SIZE; x++) {
                const u = x / (CLOUD_SURFACE_SIZE - 1);
                const lon = west + u * renderLonSpan;
                let weightedCloud = 0;
                let totalWeight = 0;

                for (let i = 0; i < samples.length; i++) {
                    const sample = samples[i];
                    const dLat = (lat - sample.lat) / sampleLatSpan;
                    const dLon = ((lon - sample.lon) * lonMetric) / sampleLonSpan;
                    const distanceSquared = dLat * dLat + dLon * dLon;
                    const weight = 1 / Math.pow(distanceSquared + 0.0028, 1.28);
                    weightedCloud += sample.cloud * weight;
                    totalWeight += weight;
                }

                const cloud = totalWeight <= 0 ? 0 : clamp(weightedCloud / totalWeight, 0, 100);
                const density = cloud / 100;
                const edgeFeather = smoothstep(0.00, 0.115, u)
                    * smoothstep(0.00, 0.115, 1 - u)
                    * smoothstep(0.00, 0.115, v)
                    * smoothstep(0.00, 0.115, 1 - v);
                const visibility = smoothstep(0.035, 0.20, density);
                const alpha = clamp((0.035 + density * 0.40) * visibility * edgeFeather, 0, 0.44);

                const pixel = (y * CLOUD_SURFACE_SIZE + x) * 4;
                pixels[pixel] = Math.round(240 - density * 57);
                pixels[pixel + 1] = Math.round(247 - density * 50);
                pixels[pixel + 2] = Math.round(251 - density * 43);
                pixels[pixel + 3] = Math.round(alpha * 255);
            }
        }

        context.putImageData(image, 0, 0);
        return L.imageOverlay(
            canvas.toDataURL('image/png'),
            [[south, west], [north, east]],
            { pane:'cloudPane', opacity:1, interactive:false }
        );
    }

    function ensureCloudSurface() {
        if (cloudSurfaceLayer || !payload || !payload.field) return;
        cloudSurfaceLayer = buildContinuousCloudSurface(payload.field);
    }

    function rebuildFieldLayers() {
        if (!map || !window.L) return;
        invalidateCloudSurface();
        windGroup = L.layerGroup();
        tempGroup = L.layerGroup();
        if (!payload || !payload.field) return;

        payload.field.forEach(function (p) {
            if (p.lat == null || p.lon == null) return;

            const flowDirection = ((p.windDirection || 0) + 180) % 360;
            const windText = p.windLabel || '--';
            const windHtml = '<div class="wind-arrow"><span class="arrow" style="transform:rotate(' + flowDirection + 'deg)">➜</span><span>' + windText + '</span></div>';
            L.marker([p.lat,p.lon], {
                interactive:false,
                icon:L.divIcon({ className:'', html:windHtml, iconSize:[80,28], iconAnchor:[40,14] })
            }).addTo(windGroup);

            const temp = p.temperature;
            const tempText = p.temperatureLabel || '--';
            const tempHtml = '<div class="temp-dot" style="background:' + tempColor(temp) + '">' + tempText + '</div>';
            L.marker([p.lat,p.lon], {
                interactive:false,
                icon:L.divIcon({ className:'', html:tempHtml, iconSize:[42,34], iconAnchor:[21,17] })
            }).addTo(tempGroup);
        });
    }

    function updateLocationMarker() {
        if (!map || !window.L || !payload) return;
        if (locationMarker) map.removeLayer(locationMarker);
        locationMarker = L.marker([payload.latitude,payload.longitude], {
            zIndexOffset:1200,
            icon:L.divIcon({
                className:'',
                html:'<div class="location-pulse"></div>',
                iconSize:[24,24],
                iconAnchor:[12,12]
            })
        }).addTo(map);
    }

    function applyLayer() {
        if (!map || suspended) return;
        clearWeatherLayers();
        if (!payload) return;

        if (activeLayer === 'rain') {
            const layer = ensureRadarLayer(frameIndex);
            if (layer && !map.hasLayer(layer)) layer.addTo(map);
        } else if (activeLayer === 'clouds') {
            ensureCloudSurface();
            if (cloudSurfaceLayer && !map.hasLayer(cloudSurfaceLayer)) cloudSurfaceLayer.addTo(map);
        } else if (activeLayer === 'wind') {
            if (windGroup && !map.hasLayer(windGroup)) windGroup.addTo(map);
        } else if (activeLayer === 'temp') {
            if (tempGroup && !map.hasLayer(tempGroup)) tempGroup.addTo(map);
        }
    }

    function applyPayloadToMap() {
        if (!map || !payload) return;
        frameIndex = payload.frames && payload.frames.length ? payload.frames.length - 1 : 0;
        rebuildFieldLayers();
        updateLocationMarker();
        map.setView([payload.latitude,payload.longitude], payload.zoom || 6, {animate:false});
        applyLayer();
    }

    window.RadarApp = {
        setData:function (data) {
            payload = (typeof data === 'string') ? JSON.parse(data) : data;
            if (!payload) return;
            if (map) {
                applyPayloadToMap();
            } else {
                loadLeaflet(false);
            }
        },
        setLayer:function (layer) {
            activeLayer = layer || 'rain';
            if (map) applyLayer();
            else loadLeaflet(false);
        },
        setFrame:function (index) {
            const numeric = Number(index);
            frameIndex = Number.isFinite(numeric) ? Math.max(0, Math.round(numeric)) : 0;
            if (payload && payload.frames && payload.frames.length) {
                frameIndex = Math.min(frameIndex, payload.frames.length - 1);
            }
            if (map && activeLayer === 'rain' && !suspended) {
                const layer = ensureRadarLayer(frameIndex);
                if (layer && !map.hasLayer(layer)) layer.addTo(map);
            }
        },
        recenter:function () {
            if (map && payload) {
                map.setView([payload.latitude,payload.longitude], payload.zoom || 6, {animate:true});
            } else {
                loadLeaflet(true);
            }
        },
        suspend:function () {
            suspended = true;
            if (map) map.stop();
        },
        resume:function () {
            suspended = false;
            if (map) {
                window.setTimeout(function () {
                    if (!map) return;
                    map.invalidateSize({animate:false, pan:false});
                    applyLayer();
                }, 0);
            } else {
                loadLeaflet(false);
            }
        },
        retryEngine:function () {
            if (!map) loadLeaflet(true);
        },
        isReady:function () {
            return !!map;
        }
    };

    loadLeaflet(false);
})();
</script>
</body>
</html>
