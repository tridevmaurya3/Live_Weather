name: Phase 26 Release Gate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-26-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Debug build, unit tests, lint, and minified Release/R8 build
        run: >-
          ./gradlew --no-daemon --stacktrace
          assembleDebug
          testDebugUnitTest
          lintDebug
          assembleRelease

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -d app/build/outputs/apk/release
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .
          test -d app/build/outputs/mapping/release
          test -f app/build/outputs/mapping/release/mapping.txt

      - name: Upload release verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-26-release-verification
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/**
