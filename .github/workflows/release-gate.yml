name: Phase 26 Release Gate

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-26-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Debug, tests, device-test APK, Release lint, APK, AAB and R8 gate
        run: >-
          ./gradlew --no-daemon --stacktrace --configuration-cache
          assembleDebug
          testDebugUnitTest
          assembleDebugAndroidTest
          lintRelease
          assembleRelease
          bundleRelease

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .
          find app/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .
          find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit | grep -q .
          test -f app/build/outputs/mapping/release/mapping.txt
          test -f app/build/reports/lint-results-release.html

      - name: Upload release verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-26-release-verification
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/**
